# Nginx Configuration for CashBee API
# File location: /etc/nginx/sites-available/cashbee-api
# Symlink: /etc/nginx/sites-enabled/cashbee-api

server {
    listen 443 ssl http2;
    server_name cashbee.api.nguocchieuvangle.io.vn;

    # SSL Configuration
    # Update these paths to your actual SSL certificate locations
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    # SSL Settings (recommended for security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Increase buffer sizes for large headers (required for JWT tokens)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 32k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Access and Error Logs
    access_log /var/log/nginx/cashbee-api-access.log;
    error_log /var/log/nginx/cashbee-api-error.log;

    # Main API proxy configuration
    location / {
        # Forward ALL requests to Spring Boot (including OPTIONS for CORS preflight)
        # Update this to your Spring Boot backend address
        proxy_pass http://localhost:8080;

        # CRITICAL: Preserve original request information for CORS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # CRITICAL: Preserve Origin header for CORS validation
        # Spring Boot needs this to validate allowed origins
        proxy_set_header Origin $http_origin;

        # Preserve all headers from client
        proxy_pass_request_headers on;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable nginx buffering for SSE/streaming responses
        proxy_buffering off;

        # IMPORTANT: DO NOT add any CORS headers here!
        # Let Spring Boot handle all CORS headers.
        # If you have any add_header 'Access-Control-*' directives, REMOVE THEM!
    }

    # Health check endpoint (optional)
    location /actuator/health {
        proxy_pass http://localhost:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name cashbee.api.nguocchieuvangle.io.vn;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}
