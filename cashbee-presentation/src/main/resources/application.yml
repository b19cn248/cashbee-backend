spring:
  application:
    name: cashbee-backend

  datasource:
    url: jdbc:mysql://localhost:3306/cashbee?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Connection pool optimization to prevent memory leaks
      maximum-pool-size: 5              # Reduced from 10 to 5 (fewer connections = less memory)
      minimum-idle: 2                   # Reduced from 5 to 2 (maintain minimum connections)
      connection-timeout: 30000         # 30 seconds to wait for connection from pool
      idle-timeout: 300000              # 5 minutes (reduced from 10 min) - idle connections are closed faster
      max-lifetime: 1200000             # 20 minutes (reduced from 30 min) - connections recycled faster
      leak-detection-threshold: 60000   # 60 seconds - detect connection leaks
      connection-test-query: SELECT 1   # Test query to validate connections
      pool-name: CashBeeHikariPool
      # Additional optimizations
      auto-commit: true
      register-mbeans: true             # Enable JMX monitoring

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate  # Use Liquibase for schema management
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: cashbee

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

  # Email Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # OAuth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak issuer URI - Spring Boot auto-downloads public keys for JWT validation
          # Format: {keycloak-url}/realms/{realm-name}
          # Example: http://localhost:8080/realms/cashbee
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.nguocchieuvangle.io.vn/realms/cashbee}
          jwk-set-uri: https://auth.nguocchieuvangle.io.vn//realms/cashbee/protocol/openid-connect/certs
          # Alternative: JWK Set URI (if you want to specify directly)
          # jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/cashbee/protocol/openid-connect/certs}

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Logging Configuration
logging:
  level:
    root: INFO
    com.cashbee: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/cashbee-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true

# Management Endpoints (Actuator) - Enhanced for memory monitoring
management:
  endpoints:
    web:
      exposure:
        # Enable more endpoints for monitoring memory and performance
        include: health,info,metrics,prometheus,heapdump,threaddump,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      # Add custom health indicators
      probes:
        enabled: true
    # Enable heap dump endpoint (use carefully in production)
    heapdump:
      enabled: true
    # Enable thread dump for debugging
    threaddump:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # Enable JVM metrics
    enable:
      jvm: true
      process: true
      system: true
      http: true
      logback: true
      hikaricp: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Health indicators
  health:
    defaults:
      enabled: true
    # Database health check
    db:
      enabled: true
    # Disk space health check
    diskspace:
      enabled: true
      threshold: 10MB

# Keycloak Configuration
# - Authorization Services: Used by Policy Enforcer to enforce permissions
# - Admin Client: Used by backend to manage users, roles, etc.
keycloak:
  # Policy Enforcer Configuration
  auth-server-url: ${KEYCLOAK_SERVER_URL:https://auth.nguocchieuvangle.io.vn/}
  realm: ${KEYCLOAK_REALM:cashbee}
  resource: ${KEYCLOAK_CLIENT_ID:cashbee-backend}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:YQbb2bIhxpsMpnfOA8U2hvkG5CqrXNJr}

  # Admin Client Configuration
  admin:
    # Keycloak server URL (without /realms suffix)
    # Example: http://localhost:8080 or https://keycloak.yourdomain.com
    server-url: ${KEYCLOAK_SERVER_URL:https://auth.nguocchieuvangle.io.vn/}

    # Realm name where users/roles are managed
    # Must match the realm in issuer-uri above
    realm: ${KEYCLOAK_REALM:cashbee}

    # Service account client credentials (RECOMMENDED for production)
    # This client must have "realm-management" roles assigned
    client-id: ${KEYCLOAK_CLIENT_ID:cashbee-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:YQbb2bIhxpsMpnfOA8U2hvkG5CqrXNJr}

    # Admin credentials (ALTERNATIVE - not recommended for production)
    # Can use admin username/password instead of client credentials
    # Comment out if using client credentials
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:1234}

# CashBee Application Configuration
cashbee:
  app:
    name: CashBee
    url: ${APP_URL:https://cashbee.nguocchieuvangle.io.vn}

  # OTP Configuration
  otp:
    expiry-minutes: 5                    # OTP expires after 5 minutes
    resend-cooldown-seconds: 30          # Minimum 30 seconds between resends
    max-resends-per-day: 5               # Maximum 5 OTP requests per email per day

  # Batch Transfer Configuration
  batch-transfer:
    # Minimum balance required for batch transfer (VND)
    min-balance: 50000

    # Admin email to receive scheduled batch transfer files
    admin-email: ${BATCH_TRANSFER_ADMIN_EMAIL:admin@cashbee.com}

    # Scheduler configuration
    scheduler:
      # Enable/disable scheduled batch transfer exports
      enabled: ${BATCH_TRANSFER_SCHEDULER_ENABLED:true}

      # Cron expression: Every Monday at 08:00
      # Format: second minute hour day-of-month month day-of-week
      # 0 0 8 * * MON = At 08:00 on Monday
      cron: ${BATCH_TRANSFER_SCHEDULER_CRON:0 0 8 * * MON}
