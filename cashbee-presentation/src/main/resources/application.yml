spring:
  application:
    name: cashbee-backend

  datasource:
    url: jdbc:mysql://localhost:33061/cashbee?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate  # Use Liquibase for schema management
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: cashbee

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

  # OAuth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak issuer URI - Spring Boot auto-downloads public keys for JWT validation
          # Format: {keycloak-url}/realms/{realm-name}
          # Example: http://localhost:8080/realms/cashbee
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.openlearnhub.io.vn/realms/cashbee}
          jwk-set-uri: https://keycloak.openlearnhub.io.vn/realms/cashbee/protocol/openid-connect/certs
          # Alternative: JWK Set URI (if you want to specify directly)
          # jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/cashbee/protocol/openid-connect/certs}

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Logging Configuration
logging:
  level:
    root: INFO
    com.cashbee: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/cashbee-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true

# Management Endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Keycloak Configuration
# - Authorization Services: Used by Policy Enforcer to enforce permissions
# - Admin Client: Used by backend to manage users, roles, etc.
keycloak:
  # Policy Enforcer Configuration
  auth-server-url: ${KEYCLOAK_SERVER_URL:https://keycloak.openlearnhub.io.vn}
  realm: ${KEYCLOAK_REALM:cashbee}
  resource: ${KEYCLOAK_CLIENT_ID:cashbee-backend}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:5AYF2PUJmbiVugCdFHdBbzfyDXQsXBAx}

  # Admin Client Configuration
  admin:
    # Keycloak server URL (without /realms suffix)
    # Example: http://localhost:8080 or https://keycloak.yourdomain.com
    server-url: ${KEYCLOAK_SERVER_URL:https://keycloak.openlearnhub.io.vn}

    # Realm name where users/roles are managed
    # Must match the realm in issuer-uri above
    realm: ${KEYCLOAK_REALM:cashbee}

    # Service account client credentials (RECOMMENDED for production)
    # This client must have "realm-management" roles assigned
    client-id: ${KEYCLOAK_CLIENT_ID:cashbee-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:5AYF2PUJmbiVugCdFHdBbzfyDXQsXBAx}

    # Admin credentials (ALTERNATIVE - not recommended for production)
    # Can use admin username/password instead of client credentials
    # Comment out if using client credentials
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:1234}
