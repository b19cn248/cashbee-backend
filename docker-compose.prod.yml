# Docker Compose cho Production (VPS)
#
# Dùng image từ Docker Hub (đã build bởi GitHub Actions)
# thay vì build local như docker-compose.yml
#
# Cách dùng:
#   1. Copy file này lên VPS
#   2. Tạo file .env cùng thư mục (xem .env.production.example)
#   3. docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.3
    container_name: cashbee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cashbee}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "33067:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cashbee-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # CashBee Backend - pull từ Docker Hub
  cashbee-backend:
    image: ${DOCKERHUB_USERNAME}/cashbee-backend:latest
    container_name: cashbee-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cashbee}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_DEFAULT_SCHEMA: ${MYSQL_DATABASE:-cashbee}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cashbee}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-cashbee-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS: >-
        -Xms1g
        -Xmx2g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heap-dump.hprof
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "8991:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - cashbee-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  cashbee-network:
    driver: bridge
    name: cashbee-network

volumes:
  mysql_data:
    driver: local
    name: cashbee-mysql-data
